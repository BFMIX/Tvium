<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pair your phone with Tvium</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#135075,#061522 55%);color:#f4f9fc;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:32px 20px 60px}header{font-size:25px;font-weight:800;color:#31d3f4;margin-bottom:48px}h1{font-size:clamp(32px,7vw,48px);letter-spacing:-.04em;margin:0 0 12px}p{color:#c3d4e0;line-height:1.5}section{margin-top:24px;padding:22px;border:1px solid #6598ab77;border-radius:20px;background:#133047b8;backdrop-filter:blur(14px)}h2{margin:0 0 12px;font-size:21px}label{display:block;margin:12px 0;font-weight:600;font-size:14px}input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #7697a7;border-radius:10px;background:#061e2e;color:#fff;font:16px system-ui}button{min-height:48px;margin-top:8px;padding:10px 18px;border:0;border-radius:10px;background:#20d0f3;color:#032032;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{min-height:25px;color:#7ee6fb}footer{margin-top:28px;font-size:13px}
  </style>
  <script src="/pairing-phone.js" defer></script>
</head>
<body><main>
  <header>▶ Tvium</header>
  <h1>Add a source with your phone</h1>
  <p>Enter your own source here, then confirm it on your TV. Details are encrypted on this phone before they are sent.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section><h2>M3U URL</h2><form><input type="hidden" name="type" value="m3u"><label>Playlist URL<input name="url" type="url" required autocomplete="off" inputmode="url"></label><button type="submit">Send to TV</button></form></section>
  <section><h2>Xtream Codes</h2><form><input type="hidden" name="type" value="xtream"><label>Server URL<input name="server" type="url" required autocomplete="off" inputmode="url"></label><label>Username<input name="username" required autocomplete="off"></label><label>Password<input name="password" type="password" required autocomplete="off"></label><button type="submit">Send to TV</button></form></section>
  <footer>The code expires after ten minutes. Tvium does not provide playlists or subscriptions.</footer>
</main></body></html>
