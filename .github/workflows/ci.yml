name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Disable Flutter analytics
        run: flutter --disable-analytics
      - name: Install workspace dependencies
        run: dart pub get && dart run melos bootstrap
      - name: Check formatting
        run: dart run melos run format:check
      - name: Analyze
        run: dart run melos run analyze
      - name: Test
        run: dart run melos run test
      - name: Build macOS app
        working-directory: apps/tvium_app
        run: flutter build macos --debug
      - name: Verify macOS entitlements
        run: >-
          dart run scripts/verify_macos_entitlements.dart
          apps/tvium_app/build/macos/Build/Products/Debug/Tvium.app

  platform-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Disable Flutter analytics
        run: flutter --disable-analytics
      - name: Install workspace dependencies
        run: dart pub get && dart run melos bootstrap
      - name: Build Android ARM64 release APK
        working-directory: apps/tvium_app
        run: flutter build apk --release --target-platform android-arm64
      - name: Build Web app
        working-directory: apps/tvium_app
        run: flutter build web --release
