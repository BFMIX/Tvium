name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.0-beta.1
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIRECTORY: apps/tvium_app
  TVIUM_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter workspace
        run: |
          flutter --disable-analytics
          dart pub get
          dart run melos bootstrap
      - name: Test macOS distribution gate
        run: bash scripts/release/test_macos_distribution_gate.sh
      - name: Prepare Developer ID signing and notarization
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.TVIUM_MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.TVIUM_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.TVIUM_APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.TVIUM_APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.TVIUM_APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in "$DEVELOPER_ID_P12_BASE64" "$DEVELOPER_ID_P12_PASSWORD" \
            "$NOTARY_KEY_BASE64" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"; do
            if [[ -z "$value" ]]; then
              echo 'Developer ID signing and notarization secrets are required for a macOS release.' >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/tvium-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          p12="$RUNNER_TEMP/tvium-developer-id.p12"
          notary_key="$RUNNER_TEMP/tvium-notary-key.p8"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$p12" "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application:/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo 'The imported certificate is not a Developer ID Application identity.' >&2
            exit 1
          fi
          echo "TVIUM_MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "TVIUM_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"
          echo "TVIUM_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "TVIUM_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Build macOS release
        working-directory: ${{ env.APP_DIRECTORY }}
        run: |
          flutter build macos --release --config-only \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="TVIUM_RELEASE_TAG=$TVIUM_RELEASE_TAG"
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            build
      - name: Sign macOS app for distribution
        working-directory: ${{ env.APP_DIRECTORY }}
        run: |
          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$TVIUM_MACOS_SIGNING_IDENTITY" \
            --entitlements macos/Runner/Release.entitlements \
            build/macos/Build/Products/Release/Tvium.app
          codesign --verify --deep --strict \
            build/macos/Build/Products/Release/Tvium.app
      - name: Package DMG
        run: >-
          scripts/release/package_macos_dmg.sh
          apps/tvium_app/build/macos/Build/Products/Release/Tvium.app
          dist/Tvium-macOS.dmg
      - name: Notarize and verify macOS DMG
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$TVIUM_MACOS_SIGNING_IDENTITY" \
            dist/Tvium-macOS.dmg
          xcrun notarytool submit dist/Tvium-macOS.dmg \
            --key "$TVIUM_NOTARY_KEY_PATH" \
            --key-id "$TVIUM_NOTARY_KEY_ID" \
            --issuer "$TVIUM_NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/tvium-notary-result.json"
          if ! jq -e '.status == "Accepted"' \
            "$RUNNER_TEMP/tvium-notary-result.json" >/dev/null; then
            echo 'Apple notarization did not accept the macOS DMG.' >&2
            exit 1
          fi
          xcrun stapler staple dist/Tvium-macOS.dmg
          scripts/release/verify_macos_distribution.sh \
            apps/tvium_app/build/macos/Build/Products/Release/Tvium.app \
            dist/Tvium-macOS.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvium-macos
          path: dist/Tvium-macOS.dmg
          if-no-files-found: error

  android:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter workspace
        run: |
          flutter --disable-analytics
          dart pub get
          dart run melos bootstrap
      - name: Prepare Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TVIUM_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TVIUM_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TVIUM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TVIUM_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo 'Android release signing secrets are required.' >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/tvium-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "TVIUM_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "TVIUM_REQUIRE_ANDROID_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          echo "TVIUM_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TVIUM_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TVIUM_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verify Android release signing gate
        run: bash scripts/release/test_android_signing_gate.sh
      - name: Build Android ARM64 release APK
        working-directory: ${{ env.APP_DIRECTORY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${TVIUM_RELEASE_TAG#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="TVIUM_RELEASE_TAG=$TVIUM_RELEASE_TAG"
      - name: Preserve APK for signing diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signing-diagnostic
          path: apps/tvium_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
      - name: Install verified APK verifier
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]]; then
            sdkmanager --install 'build-tools;34.0.0'
          fi
          bash scripts/release/select_apksigner.sh >/dev/null
      - name: Verify APK signing identity
        run: |
          set -euo pipefail
          apksigner="$(bash scripts/release/select_apksigner.sh)"
          apk="apps/tvium_app/build/app/outputs/flutter-apk/app-release.apk"
          "$apksigner" verify "$apk"
          expected="$(keytool -list -v \
            -keystore "$TVIUM_ANDROID_KEYSTORE_PATH" \
            -storepass "$TVIUM_ANDROID_STORE_PASSWORD" \
            -alias "$TVIUM_ANDROID_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          certificate_output="$("$apksigner" verify --print-certs "$apk")"
          if ! actual="$(printf '%s\n' "$certificate_output" \
            | bash scripts/release/apk_certificate_digest.sh)"; then
            printf '%s\n' "$certificate_output" \
              | sed -nE 's/^(Signer #[0-9]+ certificate [^:]+):.*/\1/p'
            exit 1
          fi
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo 'APK signing identity does not match the release key.' >&2
            echo "Expected public certificate digest: $expected" >&2
            echo "Actual public certificate digest: $actual" >&2
            exit 1
          fi
      - name: Stage APK
        run: |
          mkdir -p dist
          cp apps/tvium_app/build/app/outputs/flutter-apk/app-release.apk \
            dist/Tvium-Android-TV-arm64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvium-android
          path: dist/Tvium-Android-TV-arm64.apk
          if-no-files-found: error

  web:
    name: Build Web and Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages-enabled: ${{ steps.pages.outcome == 'success' }}
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter workspace
        run: |
          flutter --disable-analytics
          dart pub get
          dart run melos bootstrap
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Test Web release configuration
        run: bash scripts/release/test_build_web_release.sh
      - name: Build Web release for GitHub Pages
        working-directory: ${{ env.APP_DIRECTORY }}
        env:
          TVIUM_METADATA_GATEWAY: ${{ vars.TVIUM_METADATA_GATEWAY }}
          TVIUM_PAIRING_RELAY: ${{ vars.TVIUM_PAIRING_RELAY }}
        run: bash ../../scripts/release/build_web_release.sh
      - name: Package Web download
        run: >-
          scripts/release/package_web.sh
          apps/tvium_app/build/web
          dist/Tvium-Web.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvium-web
          path: dist/Tvium-Web.zip
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.pages.outcome == 'success'
        with:
          path: apps/tvium_app/build/web

  deploy-pages:
    name: Deploy GitHub Pages
    needs: web
    if: needs.web.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  publish-release:
    name: Publish GitHub release
    needs:
      - macos
      - android
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: tvium-*
          path: dist
          merge-multiple: true
      - name: Resolve release settings
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
            prerelease="$DISPATCH_PRERELEASE"
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 64
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          assets=(
            dist/Tvium-macOS.dmg
            dist/Tvium-Android-TV-arm64.apk
            dist/Tvium-Web.zip
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tvium $RELEASE_TAG" \
              --prerelease="$PRERELEASE"
            exit 0
          fi
          args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --generate-notes
            --title "Tvium $RELEASE_TAG"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
